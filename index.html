<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <!-- Geen user-scalable=no — pinch-to-zoom toegestaan (A-28) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaarteditor</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    /* Start-scherm specifieke stijlen */
    .start-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-header {
      background-color: var(--color-bg-secondary);
      border-bottom: var(--border-width) solid var(--color-bg-surface);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .start-header h1 {
      font-size: var(--font-size-h1);
      color: var(--color-text-primary);
    }

    .start-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .start-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 56px;
      width: 100%;
    }

    .start-actions a.btn-primary,
    .start-actions button {
      flex: 1;
      min-width: 240px;
      max-width: 320px;
    }

    /* --- Sjablonen ----------------------------------------------------------- */

    .template-section {
      width: 100%;
      margin-bottom: 48px;
    }

    .template-section h2 {
      margin-bottom: 20px;
      color: var(--color-text-primary);
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .template-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background-color: var(--color-bg-secondary);
      border: var(--border-width) solid var(--color-bg-surface);
      border-radius: var(--radius);
      cursor: pointer;
      min-height: var(--target-min);
      text-decoration: none;
      color: var(--color-text-primary);
      transition: border-color var(--transition-speed) ease;
    }

    .template-card:hover {
      border-color: var(--color-accent);
    }

    .template-card-thumb {
      width: 100%;
      aspect-ratio: 148 / 210;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .template-card-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .template-card-name {
      font-size: var(--font-size-label);
      font-weight: 700;
      text-align: center;
      color: var(--color-text-primary);
    }

    .template-card-category {
      font-size: var(--font-size-small);
      color: var(--color-text-secondary);
    }

    /* --- Recente kaarten --------------------------------------------------- */

    .recent-section {
      width: 100%;
    }

    .recent-section h2 {
      margin-bottom: 20px;
      color: var(--color-text-primary);
    }

    .recent-empty {
      color: var(--color-text-secondary);
      font-size: var(--font-size-body);
      padding: 24px;
      background-color: var(--color-bg-secondary);
      border-radius: var(--radius);
      text-align: center;
    }

    /* Recente kaarten grid (Sprint 3 — placeholder stijlen alvast klaar) */
    .recent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .recent-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background-color: var(--color-bg-secondary);
      border: var(--border-width) solid var(--color-bg-surface);
      border-radius: var(--radius);
      cursor: pointer;
      min-height: var(--target-min);
      text-decoration: none;
      color: var(--color-text-primary);
      font-size: var(--font-size-label);
      transition: border-color var(--transition-speed) ease;
    }

    .recent-card:hover {
      border-color: var(--color-accent);
    }

    .recent-card-thumb {
      width: 100%;
      aspect-ratio: 148 / 210; /* A5 verhouding */
      background-color: var(--color-canvas-bg);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recent-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .recent-card-placeholder {
      font-size: 2rem;
      opacity: 0.5;
    }

    .recent-card-name {
      font-size: var(--font-size-label);
      text-align: center;
      color: var(--color-text-primary);
    }
  </style>
</head>
<body>

  <!-- Skip-link: eerste DOM-element (A-06) -->
  <a href="#main-content" class="skip-link">Ga naar hoofdinhoud</a>

  <!-- Statusmeldingen voor screenreaders (A-09) -->
  <div id="status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="start-layout">

    <header class="start-header" role="banner">
      <h1>Kaarteditor</h1>
      <button type="button"
              id="btn-theme-toggle"
              class="btn btn-toggle"
              aria-pressed="false"
              aria-label="Wissel naar licht thema">
        Licht thema
      </button>
    </header>

    <main class="start-main" id="main-content">

      <!-- Primaire acties -->
      <section class="start-actions" aria-label="Kaart starten of openen">
        <a href="editor.html" class="btn btn-primary" role="button">
          + Nieuwe kaart maken
        </a>
        <button type="button" id="btn-open" class="btn" aria-label="Bestaande kaart openen">
          Openen
        </button>
      </section>

      <!-- Sjablonen als startpunt -->
      <section class="template-section" aria-label="Sjablonen">
        <h2>Beginnen met een sjabloon</h2>
        <div class="template-grid" id="template-grid" aria-label="Beschikbare sjablonen">
          <!-- Gevuld door js/templates.js -->
        </div>
      </section>

      <!-- Recente kaarten (Sprint 3 implementatie) -->
      <section class="recent-section" aria-label="Recente kaarten">
        <h2>Recente kaarten</h2>
        <div id="recent-cards-container">
          <p class="recent-empty" id="recent-empty">
            Nog geen recente kaarten. Maak een nieuwe kaart om te beginnen.
          </p>
          <div class="recent-grid" id="recent-grid" hidden aria-label="Recente kaarten lijst">
            <!-- Gevuld door Sprint 3 js/storage.js -->
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/templates.js"></script>
  <script>
    /* Thema-schakelaar initialiseren (A-19) */
    initThemeToggle();

    /* Sjablonen tonen */
    KaartTemplates.renderGrid();

    /* Recente kaarten tonen bij laden van de pagina. */
    KaartStorage.loadRecent();

    /* Knop "Openen" — bestandskiezer. */
    document.getElementById('btn-open').addEventListener('click', function () {
      KaartStorage.openFromStartScreen();
    });

    /* Drag-and-drop van een .kaart bestand op het startscherm. */
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length > 0) {
        KaartStorage.openFromStartScreenFile(files[0]);
      }
    });
  </script>

</body>
</html>
